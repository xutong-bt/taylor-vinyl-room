<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d17">
<meta name="description" content="在 Taylor Swift 的黑胶收藏环中拖动浏览十张 3D 唱片。">
<title>Taylor Swift · Vinyl Room</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;color:#f8eef6;background:#0f0b14;font-family:Inter,Helvetica,"Microsoft YaHei",sans-serif;--muted:#c3aebf;--rose:#f7c3b3}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,canvas:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.room{position:relative;min-height:620px;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 49% 57%,#2a1931,#110d17 61%);}
#stage{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}
canvas.pickable{cursor:pointer}
header{position:absolute;top:clamp(24px,5vh,56px);left:clamp(21px,6vw,96px);pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:11px;font-size:.69rem;letter-spacing:.20em;text-transform:uppercase;color:var(--rose);margin:0}
.eyebrow::before{content:"";width:25px;height:1px;background:linear-gradient(90deg,#f8c3b100,#f8c3b1)}
h1{font:400 clamp(3rem,7vw,7.3rem)/.92 "Iowan Old Style",Baskerville,Georgia,serif;letter-spacing:-.057em;margin:13px 0 9px;text-shadow:0 8px 28px #0b071480}
header>p:last-child{margin:0;color:var(--muted);font-size:clamp(.79rem,1.25vw,.94rem);line-height:1.6}
.source{position:absolute;right:clamp(18px,5vw,74px);top:clamp(24px,5vh,56px);font-size:.72rem;color:var(--muted);text-decoration:none;border-bottom:1px solid #ad82994f;padding-bottom:4px}
.source:hover{color:#fff}
.credit{position:absolute;right:clamp(14px,3vw,40px);bottom:max(7px,env(safe-area-inset-bottom));margin:0;color:var(--muted);font-size:.62rem;pointer-events:none}
.bottom{position:absolute;bottom:max(19px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(490px,calc(100% - 28px));display:flex;flex-direction:column;align-items:center;gap:13px;pointer-events:none}
.navigation,.player{pointer-events:auto}
.navigation{display:flex;align-items:center;gap:14px}
.navigation button,.play{border:0;border-radius:50%;display:grid;place-items:center;width:38px;height:38px;background:linear-gradient(145deg,#dcbac733,#3d2f42a1);box-shadow:inset 0 1px #f4d8e834,0 8px 17px #08050b88}
.navigation button:hover,.play:hover{background:#7a526e}
button:disabled{opacity:.45;cursor:default}
.counter{font-size:.73rem;letter-spacing:.16em;color:var(--muted);min-width:65px;text-align:center;font-variant-numeric:tabular-nums}
.player{width:100%;border-radius:16px;display:grid;grid-template-columns:43px minmax(0,1fr) auto 40px;gap:clamp(7px,2vw,13px);align-items:center;padding:10px 12px;background:linear-gradient(116deg,#89657768,#2e2339df 62%,#392b44c7);backdrop-filter:blur(19px) saturate(130%);box-shadow:inset 0 1px #f4cbd746,inset 0 -1px #090610ad,0 14px 33px #090510aa}
.store img{display:block;height:30px;width:auto}
.art{width:43px;height:43px;border-radius:8px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#f5b5a3 0 13%,transparent 14%),repeating-radial-gradient(circle,#302034 0 2px,#201826 3px 4px);box-shadow:inset 0 1px #edc0d746}
.art img{width:100%;height:100%;object-fit:cover}
.track{min-width:0}
.track strong,.track small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track strong{font-size:.91rem;font-weight:600}
.track small{font-size:.68rem;color:#e6c1d3;margin-top:4px}
.play{background:linear-gradient(145deg,#ffe2cd,#c993b2);color:#251727;font-size:.88rem;font-weight:700}
.play:not(:disabled):hover{background:#ffe2cd}
.progress{grid-column:1/-1;height:2px;width:100%;border-radius:10px;overflow:hidden;margin-top:-5px;background:#f0cfe525}
.progress span{display:block;width:0;height:100%;background:#f9c1a9}
.notice{position:absolute;top:55%;left:50%;transform:translate(-50%,-50%);width:min(90%,430px);margin:0;text-align:center;color:#f9ceda;line-height:1.75}
.notice[hidden]{display:none}
@media(max-width:1050px){.bottom{bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px))}}
@media(max-width:600px){.room{min-height:570px}header{top:24px}.eyebrow{font-size:.62rem}h1{font-size:clamp(3rem,13vw,4.5rem)}.source{top:27px;font-size:.66rem}.bottom{gap:8px}}
</style>
</head>
<body>
<main class="room">
  <div id="stage"></div>
  <header>
    <p class="eyebrow">The Vinyl Room</p>
    <h1>Taylor Swift</h1>
    <p>左右拖动展架 · 点击唱片试听</p>
  </header>
  <a class="source" href="https://music.apple.com/us/artist/taylor-swift/159260351" target="_blank" rel="noopener">封面来源 ↗</a>
  <p class="notice" id="notice" role="status">正在点亮听音室…</p>
  <div class="bottom">
    <nav class="navigation" aria-label="浏览唱片">
      <button type="button" id="prev" aria-label="上一张唱片" disabled>←</button>
      <span class="counter" id="counter">01 / 10</span>
      <button type="button" id="next" aria-label="下一张唱片" disabled>→</button>
    </nav>
    <section class="player" aria-label="迷你播放器">
      <div class="art"><img id="art" alt="" hidden></div>
      <div class="track" aria-live="polite"><strong id="track">选择一张唱片</strong><small id="state">官方 iTunes 试听</small></div>
      <a id="store" class="store" href="https://itunes.apple.com/us/artist/taylor-swift/159260351" target="_blank" rel="noopener noreferrer"><img src="https://marketing.services.apple/api/storage/images/64e3de01fe821600071349d4/en-us-large%401x.png" alt="前往 iTunes Store"></a>
      <button type="button" class="play" id="play" aria-label="播放" disabled>▶</button>
      <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    </section>
  </div>
  <p class="credit">音频与封面由 Apple iTunes API 提供，仅作技术演示</p>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const notice = $('notice');

try {
  const THREE = await import('three');
  init(THREE);
} catch (error) {
  console.error(error);
  notice.hidden = false;
  notice.textContent = '3D 场景启动失败。请检查网络，并在启用 WebGL 的新版浏览器中重试。';
}

function init(THREE) {
  const albums = [
    { title: 'Fearless', color: 0xc18b4f, collectionId: 1440924803 },
    { title: 'Speak Now', color: 0x926fb5, collectionId: 1440920310 },
    { title: 'Red', color: 0xb93c54, collectionId: 1440935340 },
    { title: '1989', color: 0x86b3c1, collectionId: 1445888258 },
    { title: 'Reputation', color: 0xa3a0b4, collectionId: 1440933849 },
    { title: 'Lover', color: 0xd796b5, collectionId: 1468058165 },
    { title: 'Folklore', color: 0xbdb5a7, collectionId: 1524801260 },
    { title: 'Evermore', color: 0xb87c60, collectionId: 1544275966 },
    { title: 'Midnights', color: 0x748ec8, collectionId: 1645937249 },
    { title: 'The Life of a Showgirl', color: 0xd78360, collectionId: 1838810949 },
  ].map((album, index) => ({ ...album, index, preview: null }));
  const host = $('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  const canvas = renderer.domElement;
  canvas.tabIndex = 0;
  canvas.setAttribute('aria-label', '3D 黑胶展架。左右方向键浏览，回车播放展架中央的唱片');
  host.append(canvas);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x110c18);
  scene.fog = new THREE.FogExp2(0x110c18, 0.043);
  const camera = new THREE.PerspectiveCamera(37, 1, .1, 65);
  const ring = new THREE.Group();
  ring.name = 'Album carousel';
  scene.add(ring);
  const TAU = Math.PI * 2;
  const step = TAU / albums.length;
  const radius = 6.35;
  const models = [];
  const hitMeshes = [];
  const textureLoader = new THREE.TextureLoader();

  scene.add(new THREE.AmbientLight(0xdcc4ef, .62));
  const key = new THREE.DirectionalLight(0xffead6, 2.4);
  key.position.set(-4, 8, 11);
  scene.add(key);
  const light = (color, power, x, y, z) => {
    const source = new THREE.PointLight(color, power, 24, 2);
    source.position.set(x, y, z);
    scene.add(source);
  };
  light(0xffa677, 115, -5.5, 2.5, 4);
  light(0xad73ff, 125, 5.8, 3.7, 2.8);
  light(0x985edb, 70, 0, 4, -5);

  // A procedural reflection environment puts softbox highlights on the black PVC.
  const reflectionRoom = new THREE.Scene();
  reflectionRoom.background = new THREE.Color(0x312038);
  for (const [width, height, color, x, y, z] of [
    [4, 8, 0xffc3a2, -4, 2, 5], [2, 7, 0xb597ff, 4, 1, 4],
    [9, 2, 0xffe5db, 0, 6, 1], [2.4, 8, 0xffebdc, .45, -.45, 5],
  ]) {
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(width, height),
      new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
    panel.position.set(x, y, z);
    panel.lookAt(0, 0, 0);
    if (x === .45) panel.rotateZ(-.60);
    reflectionRoom.add(panel);
  }
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(reflectionRoom, 0.07, .1, 30);
  scene.environment = environment.texture;
  pmrem.dispose();
  reflectionRoom.traverse(object => {
    if (object.isMesh) { object.geometry.dispose(); object.material.dispose(); }
  });

  const pedestal = new THREE.Mesh(
    new THREE.CylinderGeometry(7.8, 7.96, .26, 128),
    new THREE.MeshStandardMaterial({ color: 0x241b2d, metalness: .57, roughness: .44, envMapIntensity: .42 }),
  );
  pedestal.position.y = -.15;
  scene.add(pedestal);
  const inlay = (size, color, opacity, y) => {
    const rail = new THREE.Mesh(new THREE.TorusGeometry(size, .015, 8, 128),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity }));
    rail.rotation.x = -Math.PI / 2;
    rail.position.y = y;
    scene.add(rail);
  };
  inlay(7.72, 0xc78b9d, .65, -.013);
  inlay(6.36, 0xd29d90, .39, -.011);
  inlay(6.25, 0xa97add, .31, -.010);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(110, 110),
    new THREE.MeshStandardMaterial({ color: 0x110c18, roughness: .79, metalness: .12, envMapIntensity: .22 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -.31;
  scene.add(floor);

  const sleeveGeo = new THREE.BoxGeometry(2.24, 2.24, .07);
  const diskGeo = new THREE.CylinderGeometry(1.015, 1.015, .035, 96);
  diskGeo.rotateX(Math.PI / 2);
  const labelGeo = new THREE.CircleGeometry(.323, 64);
  const spindleGeo = new THREE.CircleGeometry(.038, 32);
  const grooveLines = new THREE.BufferGeometry();
  const grooveSegments = [];
  for (let ring = 0; ring < 24; ring++) {
    const r = .35 + ring * .027;
    for (let segment = 0; segment < 96; segment++) {
      for (const end of [0, 1]) {
        const angle = (segment + end) * TAU / 96;
        grooveSegments.push(Math.cos(angle) * r, Math.sin(angle) * r, .0178);
      }
    }
  }
  grooveLines.setAttribute('position', new THREE.Float32BufferAttribute(grooveSegments, 3));
  const grooveInk = new THREE.LineBasicMaterial({
    color: 0x9b7d9d, transparent: true, opacity: .145, depthWrite: false,
  });
  const edge = new THREE.MeshStandardMaterial({ color: 0x6b5652, roughness: .86 });
  const back = new THREE.MeshStandardMaterial({ color: 0x2c212f, roughness: .93 });
  const black = new THREE.MeshBasicMaterial({ color: 0x08050b });

  // A radial height map gives the disc fine, reflective microgrooves.
  const grooveCanvas = document.createElement('canvas');
  grooveCanvas.width = grooveCanvas.height = 512;
  const grooveCtx = grooveCanvas.getContext('2d');
  const pixels = grooveCtx.createImageData(512, 512);
  for (let y = 0; y < 512; y++) for (let x = 0; x < 512; x++) {
    const distance = Math.hypot(x - 255.5, y - 255.5);
    const level = distance > 79 ? 125 + Math.sin(distance * 2.5) * 58 : 125;
    const i = (y * 512 + x) * 4;
    pixels.data.set([level, level, level, 255], i);
  }
  grooveCtx.putImageData(pixels, 0, 0);
  const groove = new THREE.CanvasTexture(grooveCanvas);
  groove.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  function labelTexture(title, color) {
    const paper = document.createElement('canvas');
    paper.width = paper.height = 192;
    const ctx = paper.getContext('2d');
    ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, 192, 192);
    ctx.fillStyle = '#372035';
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Georgia';
    ctx.fillText('TS', 96, 67);
    ctx.font = '11px Helvetica';
    ctx.fillText(title.toUpperCase(), 96, 126, 147);
    ctx.fillRect(80, 143, 32, 3);
    const texture = new THREE.CanvasTexture(paper);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }

  albums.forEach(playback => {
    const { title, color, index } = playback;
    const angle = index * step;
    const album = new THREE.Group();
    album.position.set(radius * Math.sin(angle), 1.63, radius * Math.cos(angle));
    album.rotation.y = angle;
    ring.add(album);
    const coverMap = labelTexture(title, color);
    const paper = new THREE.MeshStandardMaterial({
      map: coverMap, roughness: .86, metalness: 0,
      emissive: 0xffdbef, emissiveMap: coverMap, emissiveIntensity: .035,
    });
    const sleeve = new THREE.Mesh(sleeveGeo, [edge, edge, edge, edge, paper, back]);
    sleeve.position.set(-.39, 0, .074);
    album.add(sleeve);

    const vinyl = new THREE.MeshPhysicalMaterial({
      color: 0x09080e, metalness: .8, roughness: .2,
      clearcoat: .8, clearcoatRoughness: .24,
      envMapIntensity: 1.15, bumpMap: groove, bumpScale: .013,
      emissive: 0x9f6ab9, emissiveIntensity: .008,
    });
    const spindle = new THREE.Group();
    spindle.position.x = 1.02;
    album.add(spindle);
    const disc = new THREE.Mesh(diskGeo, vinyl);
    spindle.add(disc);
    spindle.add(new THREE.LineSegments(grooveLines, grooveInk));
    const label = new THREE.Mesh(labelGeo, new THREE.MeshStandardMaterial({
      map: labelTexture(title, color), roughness: .71,
    }));
    label.position.z = .019;
    spindle.add(label);
    const center = new THREE.Mesh(spindleGeo, black);
    center.position.z = .021;
    spindle.add(center);
    for (const mesh of [sleeve, disc, label, center]) {
      mesh.userData = playback;
      hitMeshes.push(mesh);
    }
    models.push({ album, paper, vinyl, spindle, playback });
  });

  const pendingPreviews = new Map();
  function appleUrl(value) {
    try {
      const url = new URL(value);
      if (url.protocol === 'https:' && /(^|\.)(apple\.com|mzstatic\.com|apple\.co)$/i.test(url.hostname)) return url.href;
    } catch {}
    return '';
  }

  async function getResults(endpoint, params) {
    const url = new URL(endpoint, 'https://itunes.apple.com');
    url.search = new URLSearchParams({ ...params, media: 'music', entity: 'song', country: 'US' });
    const response = await fetch(url, { signal: AbortSignal.timeout(9000) });
    if (!response.ok) throw new Error('iTunes HTTP ' + response.status);
    const data = await response.json();
    return Array.isArray(data.results) ? data.results : [];
  }

  async function fetchPreview(album) {
    const playable = song => song.kind === 'song' && song.artistName === 'Taylor Swift' &&
      song.trackName && appleUrl(song.previewUrl);
    const exactId = song => playable(song) && Number(song.collectionId) === album.collectionId;
    const sameEdition = song => playable(song) &&
      song.collectionName?.trim().toLowerCase() === album.title.toLowerCase();
    const results = await getResults('/search', {
      term: 'Taylor Swift ' + album.title, attribute: 'albumTerm', limit: '25',
    });
    // An exact ID lookup handles search results crowded out by deluxe or re-recorded editions.
    const song = results.find(exactId) ?? results.find(sameEdition) ??
      (await getResults('/lookup', { id: album.collectionId, limit: '30' })).find(exactId);
    if (!song) throw new Error('该发行版本暂无官方试听');
    const originalArtwork = appleUrl(song.artworkUrl100);
    return {
      previewUrl: appleUrl(song.previewUrl),
      trackName: song.trackName,
      artworkUrl: originalArtwork.replace(/\/\d+x\d+([^/]*)$/i, '/600x600$1'),
      originalArtwork,
      storeUrl: appleUrl(song.trackViewUrl) || appleUrl(song.collectionViewUrl),
    };
  }

  async function updateArtwork(album, preview) {
    if (!preview.artworkUrl) return;
    const texture = await textureLoader.loadAsync(preview.artworkUrl)
      .catch(() => textureLoader.loadAsync(preview.originalArtwork));
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = groove.anisotropy;
    const { paper } = models[album.index];
    const old = paper.map;
    paper.map = paper.emissiveMap = texture;
    paper.needsUpdate = true;
    old.dispose();
  }

  function loadPreview(album) {
    if (album.preview) return Promise.resolve(album.preview);
    if (!pendingPreviews.has(album.index)) {
      const pending = fetchPreview(album).then(preview => {
        album.preview = preview;
        updateArtwork(album, preview).catch(() => {});
        return preview;
      }).finally(() => pendingPreviews.delete(album.index));
      pendingPreviews.set(album.index, pending);
    }
    return pendingPreviews.get(album.index);
  }

  const audio = new Audio();
  audio.preload = 'none';
  audio.volume = .64;
  const maxPreviewSeconds = 30;
  let selected = -1;
  let request = 0;
  let spinning = false;
  let loading = false;
  const paintAudio = (active, status, canPause = active) => {
    spinning = active;
    $('play').textContent = canPause ? 'Ⅱ' : '▶';
    $('play').setAttribute('aria-label', canPause ? '暂停' : '播放');
    $('state').textContent = status;
  };
  async function playAlbum(album) {
    const id = ++request;
    if (selected !== album.index) {
      audio.pause();
      selected = album.index;
      $('progress').style.width = '0%';
    }
    $('play').disabled = false;
    loading = true;
    $('track').textContent = '加载中...';
    $('art').hidden = true;
    $('store').href = 'https://itunes.apple.com/us/album/id' + album.collectionId;
    paintAudio(false, album.title + ' · 正在获取官方试听', true);
    try {
      const preview = album.preview ?? await loadPreview(album);
      if (id !== request) return;
      loading = false;
      $('track').textContent = preview.trackName;
      $('art').hidden = !preview.artworkUrl;
      if (preview.artworkUrl) $('art').src = preview.artworkUrl;
      if (preview.storeUrl) $('store').href = preview.storeUrl;
      if (audio.src !== preview.previewUrl) audio.src = preview.previewUrl;
      if (audio.ended || audio.currentTime >= maxPreviewSeconds) audio.currentTime = 0;
      paintAudio(!audio.paused && audio.readyState >= 3, album.title + ' · iTunes 官方试听', true);
      await audio.play();
    } catch (error) {
      if (id !== request || error.name === 'AbortError') return;
      loading = false;
      $('track').textContent = album.preview?.trackName ?? album.title;
      const message = error.name === 'NotAllowedError' ? '点击播放按钮开始试听'
        : error.message === '该发行版本暂无官方试听' ? error.message : '试听加载失败，点击重试';
      paintAudio(false, message);
    }
  }
  audio.addEventListener('playing', () => paintAudio(true, albums[selected].title + ' · iTunes 官方试听'));
  audio.addEventListener('waiting', () => {
    if (!loading && !audio.paused) paintAudio(false, '正在缓冲试听…', true);
  });
  audio.addEventListener('pause', () => {
    if (!loading && audio.paused && !audio.ended && audio.src === albums[selected]?.preview?.previewUrl) {
      paintAudio(false, '已暂停 · iTunes 官方试听');
    }
  });
  function advancePreview() {
    if (loading || selected < 0 || audio.src !== albums[selected].preview?.previewUrl) return;
    const next = (selected + 1) % albums.length;
    const rotation = -next * step;
    target = rotation + Math.round((shown - rotation) / TAU) * TAU;
    hover(-1);
    playAlbum(albums[next]);
  }
  audio.addEventListener('ended', advancePreview);
  audio.addEventListener('error', () => {
    if (!loading) paintAudio(false, '试听加载失败，点击重试');
  });
  audio.addEventListener('timeupdate', () => {
    if (loading || selected < 0 || audio.src !== albums[selected].preview?.previewUrl) return;
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      const duration = Math.min(audio.duration, maxPreviewSeconds);
      $('progress').style.width = Math.min(100, audio.currentTime / duration * 100) + '%';
      if (audio.duration > maxPreviewSeconds && audio.currentTime >= maxPreviewSeconds && !audio.paused) {
        advancePreview();
      }
    }
  });
  $('play').addEventListener('click', () => {
    if (loading || !audio.paused) {
      request++;
      loading = false;
      audio.pause();
      $('track').textContent = albums[selected].preview?.trackName ?? albums[selected].title;
      paintAudio(false, '已暂停 · iTunes 官方试听');
    }
    else if (selected >= 0) playAlbum(models[selected].playback);
  });

  let target = 0;
  let shown = 0;
  let hovered = -1;
  let drag = null;
  let visibleIndex = 0;
  const pointer = new THREE.Vector2();
  const ray = new THREE.Raycaster();
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  function pick(event) {
    const bounds = canvas.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom) return null;
    pointer.set((event.clientX - bounds.left) / bounds.width * 2 - 1,
      1 - (event.clientY - bounds.top) / bounds.height * 2);
    ray.setFromCamera(pointer, camera);
    return ray.intersectObjects(hitMeshes, false)[0]?.object.userData ?? null;
  }
  function hover(index) {
    hovered = index;
    canvas.classList.toggle('pickable', index >= 0);
  }
  const snap = angle => Math.round(angle / step) * step;
  function browse(direction) {
    target = snap(target) - direction * step;
    hover(-1);
  }
  $('prev').addEventListener('click', () => browse(-1));
  $('next').addEventListener('click', () => browse(1));
  canvas.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      browse(event.key === 'ArrowLeft' ? -1 : 1);
    } else if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      playAlbum(models[visibleIndex].playback);
    }
  });
  canvas.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || drag) return;
    canvas.focus({ preventScroll: true });
    canvas.setPointerCapture(event.pointerId);
    drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY,
      x: event.clientX, time: event.timeStamp, velocity: 0, moved: false };
  });
  canvas.addEventListener('pointermove', event => {
    if (!drag) {
      if (event.pointerType === 'mouse') hover(pick(event)?.index ?? -1);
      return;
    }
    if (drag.id !== event.pointerId) return;
    if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 7) return;
    if (!drag.moved) {
      drag.moved = true;
      target = shown;
      hover(-1);
      canvas.classList.add('dragging');
    }
    const delta = (event.clientX - drag.x) * 0.007;
    target += delta;
    drag.velocity = delta / Math.max(8, event.timeStamp - drag.time);
    drag.x = event.clientX;
    drag.time = event.timeStamp;
  });
  function endPointer(event, cancelled) {
    if (!drag || drag.id !== event.pointerId) return;
    const last = drag;
    drag = null;
    canvas.classList.remove('dragging');
    if (last.moved) {
      const quick = event.timeStamp - last.time < 95;
      const inertia = quick && !motion.matches ? THREE.MathUtils.clamp(last.velocity * 105, -1.12, 1.12) : 0;
      target = snap(target + inertia);
    } else if (!cancelled) {
      const hit = pick(event);
      if (hit) playAlbum(hit);
    }
  }
  canvas.addEventListener('pointerup', event => endPointer(event, false));
  canvas.addEventListener('pointercancel', event => endPointer(event, true));
  canvas.addEventListener('lostpointercapture', event => endPointer(event, true));
  canvas.addEventListener('pointerleave', () => { if (!drag) hover(-1); });
  let wheelTimer;
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
    const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.clientWidth : 1;
    target -= THREE.MathUtils.clamp(delta * units, -140, 140) * .005;
    hover(-1);
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { target = snap(target); }, 120);
  }, { passive: false });

  function resize() {
    const width = host.clientWidth;
    const height = host.clientHeight;
    camera.aspect = width / height;
    camera.fov = camera.aspect < .75 ? 47 : 36;
    camera.position.set(0, 4.15, camera.aspect < .75 ? 18.1 : 16.35);
    camera.lookAt(0, 1.60, 3.0);
    camera.updateProjectionMatrix();
    renderer.setSize(width, height, false);
  }
  new ResizeObserver(resize).observe(host);
  resize();
  let previousFrame = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(.06, (now - previousFrame) / 1000);
    previousFrame = now;
    shown = motion.matches ? target : THREE.MathUtils.damp(shown, target, drag?.moved ? 21 : 8, dt);
    ring.rotation.y = shown;
    const slot = ((Math.round(-shown / step) % albums.length) + albums.length) % albums.length;
    if (slot !== visibleIndex) {
      visibleIndex = slot;
      $('counter').textContent = String(slot + 1).padStart(2, '0') + ' / ' + albums.length;
    }
    models.forEach(({ album, paper, vinyl, spindle }, index) => {
      const bright = hovered === index;
      const scale = THREE.MathUtils.damp(album.scale.x, bright ? 1.05 : 1, 14, dt);
      album.scale.setScalar(scale);
      paper.emissiveIntensity = THREE.MathUtils.damp(paper.emissiveIntensity, bright ? .31 : .035, 14, dt);
      vinyl.emissiveIntensity = THREE.MathUtils.damp(vinyl.emissiveIntensity, bright ? .14 : .008, 14, dt);
      if (spinning && index === selected) spindle.rotation.z -= dt * TAU * (33.33 / 60);
    });
    renderer.render(scene, camera);
  });
  canvas.addEventListener('webglcontextlost', () => {
    notice.textContent = '浏览器暂停了 3D 渲染，请刷新恢复。';
    notice.hidden = false;
    audio.pause();
  });
  $('prev').disabled = $('next').disabled = false;
  notice.hidden = true;
  // Pre-warm the first covers without firing ten requests simultaneously.
  let nextCover = 0;
  async function hydrateCovers() {
    while (nextCover < albums.length) {
      const album = albums[nextCover++];
      await loadPreview(album).catch(() => {});
    }
  }
  void hydrateCovers();
  void hydrateCovers();
}
</script>
</body>
